<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SignatureTutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
/* @inline:app-css:start */
/* SignatureTutor — hi-fi glass design system (Apple-style, light) */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap');

:root {
  --bg-0: #f4f2ee;
  --bg-1: #ebe8e1;
  --bg-warm: #f7f4ed;
  --ink: #14110d;
  --ink-1: #2d2823;
  --ink-2: #5b544a;
  --ink-3: #8a8378;
  --ink-4: #bab3a6;
  --line: rgba(20, 17, 13, 0.09);
  --line-2: rgba(20, 17, 13, 0.16);
  --accent: #c6522b;
  --accent-2: #e0b778;
  --blue: #2c4f78;
  --green: #4a7a4f;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-shadow:
    0 1px 0 rgba(255, 255, 255, 0.9) inset,
    0 0 0 0.5px rgba(20, 17, 13, 0.08),
    0 4px 18px rgba(20, 17, 13, 0.06),
    0 24px 60px -20px rgba(20, 17, 13, 0.18);
  --glass-shadow-lg:
    0 1px 0 rgba(255, 255, 255, 0.9) inset,
    0 0 0 0.5px rgba(20, 17, 13, 0.1),
    0 8px 30px rgba(20, 17, 13, 0.08),
    0 40px 100px -30px rgba(20, 17, 13, 0.22);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: 'Fraunces', Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg-0);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Ambient backdrop — soft blurred color blobs behind the glass */
.stage {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}
.stage::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 700px at 10% 5%, rgba(230, 195, 160, 0.55), transparent 60%),
    radial-gradient(800px 600px at 92% 15%, rgba(198, 82, 43, 0.18), transparent 60%),
    radial-gradient(1000px 800px at 85% 95%, rgba(136, 175, 198, 0.35), transparent 60%),
    radial-gradient(700px 500px at 20% 90%, rgba(224, 183, 120, 0.35), transparent 55%),
    linear-gradient(180deg, #f7f3ec 0%, #ede8de 100%);
  z-index: -2;
}
.stage::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(20,17,13,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  opacity: 0.5;
  z-index: -1;
  pointer-events: none;
}

/* Glass surfaces */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-md);
}
.glass.strong {
  background: var(--glass-bg-strong);
  box-shadow: var(--glass-shadow-lg);
}
.glass.flat {
  box-shadow:
    0 0 0 0.5px rgba(20, 17, 13, 0.06),
    0 1px 2px rgba(20, 17, 13, 0.04);
}

/* Typography helpers */
.display {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.03em;
  line-height: 1.02;
}
.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 500;
}
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* Buttons */
.btn {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 999px;
  border: 0.5px solid rgba(20,17,13,0.12);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 1px 3px rgba(20,17,13,0.05);
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.85); transform: translateY(-0.5px); }
.btn:active { transform: translateY(0); }
.btn.primary {
  background: var(--ink);
  color: #f6f1e6;
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 8px 24px -6px rgba(20,17,13,0.3);
}
.btn.primary:hover { background: var(--ink-1); }
.btn.accent {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 8px 24px -6px rgba(198,82,43,0.4);
}
.btn.accent:hover { background: #b24725; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: rgba(20,17,13,0.04); }
.btn.lg { padding: 14px 24px; font-size: 15px; }
.btn.sm { padding: 6px 12px; font-size: 12px; gap: 4px; }
.btn.icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

/* Icon button pill */
.iconbtn {
  width: 38px; height: 38px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  border: 0.5px solid rgba(20,17,13,0.1);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ink-1);
  transition: all 0.15s ease;
  box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 1px 3px rgba(20,17,13,0.04);
}
.iconbtn:hover { background: #fff; color: var(--ink); }
.iconbtn.active { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Inputs */
.input {
  font-family: var(--sans);
  font-size: 18px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  border: 0.5px solid rgba(20,17,13,0.14);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  color: var(--ink);
  width: 100%;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 4px rgba(20,17,13,0.06);
}
.input.big { font-size: 28px; font-family: var(--serif); padding: 20px 22px; font-weight: 400; letter-spacing: -0.01em; }

/* Chip */
.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(255,255,255,0.7);
  border: 0.5px solid rgba(20,17,13,0.1);
  color: var(--ink-1);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.chip:hover { background: #fff; }
.chip.active { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Progress bar (top) */
.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}
.progress .track { width: 140px; height: 4px; border-radius: 999px; background: rgba(20,17,13,0.08); overflow: hidden; }
.progress .fill { height: 100%; background: var(--ink); border-radius: 999px; transition: width 0.4s cubic-bezier(.2,.7,.3,1); }

/* Card */
.card {
  border-radius: var(--radius-lg);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  padding: 28px;
}

/* Page layout */
.shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand .mark {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: var(--ink);
  color: #f6f1e6;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 16px;
}

.content {
  flex: 1;
  padding: 0 28px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrap { width: 100%; max-width: 1180px; }
.wrap-narrow { width: 100%; max-width: 640px; }

/* Sliders */
.slider-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 14px; padding: 8px 0; }
.slider-row .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.slider-row .val { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; }
.slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 999px;
  background: rgba(20,17,13,0.1); outline: none;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 0.5px solid rgba(20,17,13,0.2);
  box-shadow: 0 1px 3px rgba(20,17,13,0.15), 0 0 0 0.5px rgba(20,17,13,0.06);
  cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 0.5px solid rgba(20,17,13,0.2);
  box-shadow: 0 1px 3px rgba(20,17,13,0.15);
  cursor: pointer;
}

/* Style card */
.style-card {
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  border: 0.5px solid rgba(20,17,13,0.1);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(.2,.7,.3,1);
  position: relative;
  overflow: hidden;
}
.style-card:hover { background: rgba(255,255,255,0.85); transform: translateY(-2px); box-shadow: 0 12px 30px -10px rgba(20,17,13,0.12); }
.style-card.selected {
  background: rgba(255,255,255,0.95);
  border-color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink), 0 20px 40px -15px rgba(20,17,13,0.25);
}
.style-card .label { font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.style-card .preview { height: 80px; display: flex; align-items: center; justify-content: center; }

/* Worksheet row */
.ws-row {
  height: 78px;
  border-bottom: 1px solid rgba(20,17,13,0.08);
  padding: 0 24px 0 56px;
  position: relative;
  display: flex;
  align-items: center;
  background:
    linear-gradient(to bottom, transparent 0%, transparent calc(100% - 22px), rgba(20,17,13,0.04) calc(100% - 22px), rgba(20,17,13,0.04) calc(100% - 21px), transparent calc(100% - 21px));
}
.ws-row .num {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: 0.05em;
  width: 22px;
  text-align: right;
}
.ws-row .stage-badge {
  position: absolute;
  right: 18px;
  top: 10px;
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}

/* Tweak panel */
.tweaks {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 200;
  width: 260px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,0.7);
  border-radius: var(--radius-md);
  box-shadow: var(--glass-shadow-lg);
  padding: 14px 16px;
  font-size: 13px;
}
.tweaks h4 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.tweaks .t-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
.tweaks .t-row .t-label { font-size: 12px; color: var(--ink-2); }
.tweaks input[type="text"] { font-family: var(--sans); font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); width: 120px; }
.tweaks select { font-family: var(--sans); font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); }
.tweaks .toggle { border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); padding: 3px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; font-family: var(--sans); }
.tweaks .toggle.on { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Modal */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.3);
  backdrop-filter: blur(10px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow-lg);
  padding: 28px;
  max-width: 480px;
  width: 100%;
  animation: popIn 0.25s cubic-bezier(.2,.7,.3,1);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

/* Fade transitions between screens */
.screen {
  animation: screenIn 0.35s cubic-bezier(.2,.7,.3,1);
}
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Segmented control */
.seg {
  display: inline-flex;
  padding: 3px;
  background: rgba(20,17,13,0.06);
  border-radius: 999px;
  gap: 2px;
}
.seg button {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--sans);
  background: transparent;
  border: none;
  border-radius: 999px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.15s ease;
}
.seg button.on {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20,17,13,0.1);
}

/* Small pulse dot for "live" */
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(74,122,79,0.6); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,122,79,0.5); } 70% { box-shadow: 0 0 0 6px rgba(74,122,79,0); } 100% { box-shadow: 0 0 0 0 rgba(74,122,79,0); } }

/* Hide scrollbars on inner panes */
.noscroll { scrollbar-width: none; }
.noscroll::-webkit-scrollbar { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      .worksheet-paper, .worksheet-paper * { visibility: visible !important; }
      .worksheet-paper { position: absolute !important; left: 0; top: 0; width: 100% !important; box-shadow: none !important; border: none !important; }
      .tweaks, .topbar { display: none !important; }
    }
/* @inline:app-css:end */
  </style>
</head>

    doc.setFontSize(10);
    doc.setTextColor(140, 130, 115);
    var dateStr = new Date().toISOString().slice(0, 10);
    doc.text(styleLabel + ' · ' + dateStr, MARGIN, MARGIN + 16);

    var heroH = cw * 0.25;
    await renderRowIntoPdf(doc, name, styleKey, opts, variant, MARGIN, MARGIN + 22, cw, heroH, { mode: 'ink', arrows: false });
    addRuleLines(doc, MARGIN, MARGIN + 22, cw, heroH);

    var figY = MARGIN + 22 + heroH + 10;
    doc.setFontSize(9);
    doc.setTextColor(140, 130, 115);
    doc.text('STROKE ORDER', MARGIN, figY);
    var figH = cw * 0.2;
    await renderRowIntoPdf(doc, name, styleKey, opts, variant, MARGIN, figY + 4, cw, figH, { mode: 'line', fade: 1, arrows: true, strokeW: 1.8 });
    addRuleLines(doc, MARGIN, figY + 4, cw, figH);

    doc.setFontSize(9);
    doc.setTextColor(140, 130, 115);
    doc.text('Tip: practice from the numbered strokes, then trace the fading rows on the next pages.', MARGIN, size.h - MARGIN);

    // Pages 2-3: trace ladder, 8 rows/page, fading per an opacity ladder
    // implemented as a color blend toward white (not SVG opacity — more
    // reliable through svg2pdf/print pipelines).
    var LADDERS = [
      [1, 1, 0.8, 0.8, 0.6, 0.6, 0.45, 0.45],
      [0.3, 0.3, 0.15, 0.15, 0, 0, 0, 0],
    ];
    var rowH = 27;
    for (var page = 0; page < LADDERS.length; page++) {
      doc.addPage([size.w, size.h]);
      var ladder = LADDERS[page];
      var top = MARGIN;
      for (var r = 0; r < ladder.length; r++) {
        var fade = ladder[r];
        var y2 = top + r * rowH;
        if (fade > 0) {
          await renderRowIntoPdf(doc, name, styleKey, opts, variant, MARGIN, y2, cw, rowH - 4, { mode: 'line', fade: fade, arrows: r < 2, strokeW: 1.6 });
        }
        addRuleLines(doc, MARGIN, y2, cw, rowH - 4);
      }
    }

    // Page 4: blank rule rows.
    doc.addPage([size.w, size.h]);
    var blankRowH = (size.h - MARGIN * 2) / 10;
    for (var b = 0; b < 10; b++) {
      addRuleLines(doc, MARGIN, MARGIN + b * blankRowH, cw, blankRowH - 3);
    }

    doc.save(slug(name) + '-workbook.pdf');
  }

  Object.assign(window, { makeWorkbook, exportSvg, exportPng, slug });
})();
// @inline:exporters:end
</script>

// The ghost overlay is a `position:absolute; inset: GHOST_INSET` box around
// a SignatureSVG using preserveAspectRatio="xMidYMid meet" — accuracy
// scoring maps the reference signature into canvas space with the exact
// same box-fit math so the two never drift apart.
const GHOST_INSET = 30;
const GHOST_HEIGHT = 280;
const GHOST_WIDTH = 720;

function sigToCanvasMapper(canvasW, canvasH) {
  const boxW = canvasW - GHOST_INSET * 2;
  const boxH = canvasH - GHOST_INSET * 2;
  const scale = Math.min(boxW / GHOST_WIDTH, boxH / GHOST_HEIGHT);
  const offsetX = GHOST_INSET + (boxW - GHOST_WIDTH * scale) / 2;
  const offsetY = GHOST_INSET + (boxH - GHOST_HEIGHT * scale) / 2;
  return { scale, map: (x, y) => [offsetX + x * scale, offsetY + y * scale] };
}

function resamplePts(pts, spacing) {
  if (pts.length < 2) return pts.slice();
  const out = [pts[0]];
  let carry = 0;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (segLen < 1e-6) continue;
    let t = carry;
    while (t < segLen) {
      const f = t / segLen;
      out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]);
      t += spacing;
    }
    carry = t - segLen;
  }
  return out;
}

function gridBucket(pts, cellSize) {
  const grid = new Map();
  pts.forEach((p, i) => {
    const key = Math.floor(p[0] / cellSize) + ',' + Math.floor(p[1] / cellSize);
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(p);
  });
  return {
    hasNeighborWithin(p, tol) {
      const cx = Math.floor(p[0] / cellSize), cy = Math.floor(p[1] / cellSize);
      for (let dx = -1; dx <= 1; dx++) {
        for (let dy = -1; dy <= 1; dy++) {
          const bucket = grid.get((cx + dx) + ',' + (cy + dy));
          if (!bucket) continue;
          for (const q of bucket) if (Math.hypot(q[0] - p[0], q[1] - p[1]) <= tol) return true;
        }
      }
      return false;
    },
  };
}

function computeAccuracy(userPtsFlat, name, style, opts, variant, canvasW, canvasH) {
  const sig = window.buildSignature(name || 'Your Name', style, { ...opts, width: GHOST_WIDTH, height: GHOST_HEIGHT, variant });
  const { scale, map } = sigToCanvasMapper(canvasW, canvasH);
  const refFlat = [];
  sig.strokes.forEach(s => {
    if (s.kind !== 'body' && s.kind !== 'extra') return;
    s.pts.forEach(([x, y]) => refFlat.push(map(x, y)));
  });
  if (!refFlat.length || !userPtsFlat.length) return { score: 0, verdict: 'Keep tracing' };

  const tol = 14 * scale;
  const refSamples = resamplePts(refFlat, 4);
  const userSamples = resamplePts(userPtsFlat, 4);
  const refGrid = gridBucket(refSamples, tol);
  const userGrid = gridBucket(userSamples, tol);

  const covered = refSamples.filter(p => userGrid.hasNeighborWithin(p, tol)).length;
  const precise = userSamples.filter(p => refGrid.hasNeighborWithin(p, tol)).length;
  const coverage = covered / refSamples.length;
  const precision = precise / userSamples.length;
  const score = Math.round(100 * (0.6 * coverage + 0.4 * precision));
  const verdict = score >= 85 ? 'Excellent' : score >= 65 ? 'Close' : 'Keep tracing';
  return { score, verdict };
}

function PracticeScreen({ name, style, opts, variant, onBack }) {
  const [row, setRow] = React.useState(0);
  const [penColor, setPenColor] = React.useState('#14110d');
  const [result, setResult] = React.useState(null);
  const [strokeCount, setStrokeCount] = React.useState(0);
  const [showGhost, setShowGhost] = React.useState(true);
  const canvasRef = React.useRef(null);
  const dprRef = React.useRef(window.devicePixelRatio || 1);
  const drawingRef = React.useRef(null);
  const strokesRef = React.useRef([]); // CSS-pixel-space points, one array per stroke

  const stages = [
    { stage: 'guide',  label: 'Full guide',    arrows: true,  opacity: 1 },
    { stage: 'guide',  label: 'Full guide',    arrows: false, opacity: 1 },
    { stage: 'fade50', label: '50% fade',      arrows: false, opacity: 0.35 },
    { stage: 'fade50', label: '50% fade',      arrows: false, opacity: 0.35 },
    { stage: 'fade20', label: '20% fade',      arrows: false, opacity: 0.14 },
    { stage: 'fade20', label: '20% fade',      arrows: false, opacity: 0.14 },
    { stage: 'blank',  label: 'Freehand',      arrows: false, opacity: 0 },
    { stage: 'blank',  label: 'Freehand · last', arrows: false, opacity: 0 },
  ];
  const cur = stages[row];
  const progress = ((row + 1) / stages.length) * 100;

  const redraw = () => {
    const c = canvasRef.current; if (!c) return;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const strokePts of strokesRef.current) {
      for (let i = 1; i < strokePts.length; i++) {
        const a = strokePts[i - 1], b = strokePts[i];
        ctx.strokeStyle = a.color;
        ctx.lineWidth = 1.5 + b.p * 3.2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  };

  // Canvas drawing — CSS-pixel space throughout; the backing store's dpr
  // scale is applied once via ctx.setTransform in the resize effect, so
  // pointer coordinates need no further scaling (the old bug double- and
  // triple-counted the dpr/backing-store factor here).
  const onPointerDown = (e) => {
    const c = canvasRef.current; if (!c) return;
    c.setPointerCapture(e.pointerId);
    const rect = c.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const pressure = e.pressure || 0.5;
    drawingRef.current = [{ x, y, p: pressure, color: penColor }];
  };
  const onPointerMove = (e) => {
    if (!drawingRef.current) return;
    const c = canvasRef.current;
    const rect = c.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const pressure = e.pressure || 0.5;
    const pts = drawingRef.current;
    const last = pts[pts.length - 1];
    pts.push({ x, y, p: pressure, color: penColor });
    const ctx = c.getContext('2d');
    ctx.strokeStyle = penColor;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = 1.5 + pressure * 3.2;
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const onPointerUp = () => {
    if (!drawingRef.current) return;
    strokesRef.current.push(drawingRef.current);
    drawingRef.current = null;
    setStrokeCount(strokesRef.current.length);
  };

  const clearCanvas = () => {
    strokesRef.current = [];
    redraw();
    setStrokeCount(0);
    setResult(null);
  };
  const undo = () => {
    strokesRef.current.pop();
    redraw();
    setStrokeCount(strokesRef.current.length);
    setResult(null);
  };

  const checkAccuracy = () => {
    const c = canvasRef.current; if (!c) return;
    const rect = c.getBoundingClientRect();
    const userPtsFlat = [];
    for (const strokePts of strokesRef.current) for (const p of strokePts) userPtsFlat.push([p.x, p.y]);
    setResult(computeAccuracy(userPtsFlat, name, style, opts, variant, rect.width, rect.height));
  };

  const nextRow = () => {
    clearCanvas();
    setRow(r => Math.min(stages.length - 1, r + 1));
  };
  const prevRow = () => {
    clearCanvas();
    setRow(r => Math.max(0, r - 1));
  };

  // Resize canvas to its container (CSS-pixel space, dpr backing store).
  React.useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const resize = () => {
      const rect = c.getBoundingClientRect();
      const dpr = dprRef.current;
      c.width = Math.round(rect.width * dpr);
      c.height = Math.round(rect.height * dpr);
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(c);
    return () => ro.disconnect();
  }, []);

  return (
    <div className="screen wrap" style={{ paddingTop: 20, paddingBottom: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <button className="btn ghost sm" onClick={onBack}>
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M11 7H3M7 3L3 7l4 4"/></svg>
            Exit
          </button>
          <div>
            <div className="eyebrow" style={{ marginBottom: 4 }}>Practice · row {row + 1} of {stages.length}</div>
            <div className="display" style={{ fontSize: 22 }}>{name}</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <span className="faint" style={{ fontSize: 12, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span className="live-dot"></span> Live · pressure on
          </span>
          <div style={{ width: 160, height: 4, background: 'rgba(20,17,13,0.08)', borderRadius: 999, overflow: 'hidden' }}>
            <div style={{ width: `${progress}%`, height: '100%', background: 'var(--ink)', transition: 'width 0.3s' }}></div>
          </div>
        </div>
      </div>

      {/* Coach card */}
      <div className="card" style={{ padding: '14px 20px', marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--accent)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>★</div>
          <div>
            <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--ink-3)' }}>Coach · {cur.label}</div>
            <div style={{ fontSize: 14, marginTop: 2 }}>
              {row === 0 && 'Follow the numbered strokes. Keep your pen down through each word.'}
              {row === 1 && 'Trace the full guide. Try to match the slant and spacing.'}
              {(row === 2 || row === 3) && 'Guide is lighter now — use it as a hint, not a cage.'}
              {(row === 4 || row === 5) && 'Almost gone. Trust your muscle memory.'}
              {row >= 6 && 'Freehand. Do it three times without looking back.'}
            </div>
          </div>
        </div>
        {result !== null && (
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 11, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>{result.verdict}</div>
            <div className="display" style={{ fontSize: 28, color: result.score >= 85 ? 'var(--green)' : result.score >= 65 ? 'var(--accent)' : 'var(--ink-2)' }}>{result.score}%</div>
          </div>
        )}
      </div>

      {/* Canvas */}
      <div className="card" style={{ padding: 0, overflow: 'hidden', position: 'relative', minHeight: 340 }}>
        {/* Ghost layer */}
        {showGhost && cur.opacity > 0 && (
          <div style={{ position: 'absolute', inset: 30, pointerEvents: 'none' }}>
            <SignatureSVG name={name} style={style} opts={opts} variant={variant} renderMode="line" strokeColor="#14110d" strokeW={2.6} opacity={cur.opacity} showArrows={cur.arrows} height={280} />
          </div>
        )}
        {/* Drawing canvas */}
        <canvas
          ref={canvasRef}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', touchAction: 'none', cursor: 'crosshair' }}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
        />
        {/* Baseline */}
        <div style={{ position: 'absolute', left: 30, right: 30, top: '62%', height: 1, background: 'rgba(20,17,13,0.08)', pointerEvents: 'none' }}></div>
      </div>

      {/* Dock */}
      <div className="card" style={{ padding: '12px 18px', marginTop: 14, display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ display: 'flex', gap: 6 }}>
          {['#14110d', '#2c4f78', '#c6522b', '#4a7a4f'].map(c => (
            <button key={c} className="iconbtn" style={{ background: c, border: penColor === c ? '2px solid var(--ink)' : '0.5px solid rgba(20,17,13,0.1)' }} onClick={() => setPenColor(c)}></button>
          ))}
        </div>
        <div style={{ width: 1, height: 24, background: 'rgba(20,17,13,0.1)' }}></div>
        <button className="iconbtn" title="Undo" onClick={undo} disabled={strokeCount === 0}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M3 8a5 5 0 1 1 5 5H6M3 5v3h3"/></svg>
        </button>
        <button className="iconbtn" title="Clear" onClick={clearCanvas} disabled={strokeCount === 0}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
        </button>
        <button className={`iconbtn ${showGhost ? 'active' : ''}`} title="Toggle ghost" onClick={() => setShowGhost(g => !g)}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M2 8a6 6 0 0 1 12 0v6l-2-1.5L10 14l-2-1.5L6 14l-2-1.5L2 14z"/></svg>
        </button>
        <div style={{ flex: 1 }}></div>
        <button className="btn sm" onClick={prevRow} disabled={row === 0}>◀ Prev</button>
        <button className="btn sm" onClick={checkAccuracy} disabled={strokeCount === 0}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7l3 3 7-7"/></svg>
          Check
        </button>
        <button className="btn primary sm" onClick={nextRow} disabled={row === stages.length - 1}>Next row ▶</button>
      </div>
    </div>
  );
}

// ─────────────── Export modal ───────────────
function ExportModal({ name, style, opts, variant, onClose }) {
  const [copied, setCopied] = React.useState(false);
  const [busy, setBusy] = React.useState(null);
  const [replayKey, setReplayKey] = React.useState(0);
  const copyLink = () => {
    const params = new URLSearchParams({ name, style, f: opts.flourish, s: opts.slant, w: opts.weight });
    navigator.clipboard?.writeText(`https://signature-tutor.app/s/${btoa(params.toString()).slice(0, 10)}`);
    setCopied(true);
    setTimeout(() => setCopied(false), 1600);
  };
  const runExport = async (key) => {
    setBusy(key);
    try {
      if (key === 'svg') window.exportSvg(name, style, opts, variant);
      else if (key === 'png') await window.exportPng(name, style, opts, variant);
      else if (key === 'pdf') await window.makeWorkbook(name, style, opts, variant, 'a4');
      else if (key === 'replay') setReplayKey(k => k + 1);
    } catch (err) {
      console.error('export failed', err);
      window.alert('Export failed: ' + (err?.message || err));
    } finally {
      setBusy(null);
    }
  };
  return (
    <div className="backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
          <div>
            <div className="eyebrow" style={{ marginBottom: 6 }}>Export</div>
            <h2 className="display" style={{ fontSize: 28, margin: 0 }}>Take it with you</h2>
          </div>
          <button className="iconbtn" onClick={onClose}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>
          </button>
        </div>

        <div style={{ padding: '20px 24px', background: '#fefdfa', border: '0.5px solid rgba(20,17,13,0.08)', borderRadius: 12, marginBottom: 18, height: 110 }}>
          <SignatureSVG key={replayKey} name={name} style={style} opts={opts} variant={variant} renderMode="ink" height={80} strokeW={2.4} animate={true} />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {[
            { k: 'svg', t: 'SVG', d: 'Vector, infinite resolution' },
            { k: 'png', t: 'PNG', d: 'Transparent raster' },
            { k: 'pdf', t: 'Worksheet PDF', d: '4-page practice workbook' },
            { k: 'replay', t: 'Replay animation', d: 'Watch the stroke-by-stroke reveal' },
          ].map(o => (
            <button
              key={o.k}
              className="glass"
              disabled={busy !== null}
              style={{ padding: 14, textAlign: 'left', border: '0.5px solid rgba(20,17,13,0.1)', background: 'rgba(255,255,255,0.6)', cursor: busy ? 'wait' : 'pointer', borderRadius: 12, fontFamily: 'inherit', opacity: busy && busy !== o.k ? 0.5 : 1 }}
              onClick={() => runExport(o.k)}
            >
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>{busy === o.k ? 'Working…' : o.t}</div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>{o.d}</div>
            </button>
          ))}
        </div>

        <div style={{ marginTop: 16, padding: 14, background: 'rgba(20,17,13,0.04)', borderRadius: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 10l-2 2a3 3 0 1 1-4-4l2-2M9 6l2-2a3 3 0 1 1 4 4l-2 2M6 10l4-4"/></svg>
          <div style={{ flex: 1, fontSize: 12, fontFamily: 'ui-monospace, Menlo, monospace', color: 'var(--ink-2)' }}>
            signature-tutor.app/s/{btoa(name).slice(0, 10)}
          </div>
          <button className="btn sm" onClick={copyLink}>{copied ? '✓ Copied' : 'Copy link'}</button>
        </div>
      </div>
    </div>
  );
}

<script type="text/babel" data-presets="react">
// @inline:app:start
    const TWEAK_DEFAULTS = {
      "sampleName": "Alex Morgan",

      const DEFAULT_STYLE = 'flow';
      const defaultOptsFor = (styleKey) => {
        const recipe = SIG_STYLES[styleKey] || SIG_STYLES[DEFAULT_STYLE];
        return { flourish: recipe.flourish, slant: recipe.slant, weight: recipe.weight, legibility: recipe.legibility };
      };

      const initial = React.useMemo(() => {
        try {
          const v2 = JSON.parse(localStorage.getItem('sigtutor:v2') || 'null');
          if (v2) {
            return {
              screen: v2.screen || tweaks.startScreen || 'name',
              name: v2.name || tweaks.sampleName,
              style: v2.style || DEFAULT_STYLE,
              opts: { ...defaultOptsFor(v2.style || DEFAULT_STYLE), ...(v2.opts || {}) },
              variant: v2.variant || 0,
            };
          }
          // One-way migration from the old procedural-wiggle engine's schema.
          const v1 = JSON.parse(localStorage.getItem('sigtutor:v1') || '{}');
          const migratedStyle = V1_STYLE_MIGRATION[v1.style] || v1.style || DEFAULT_STYLE;
          const migratedOpts = { ...defaultOptsFor(migratedStyle), ...(v1.opts || {}) };
          return {
            screen: v1.screen || tweaks.startScreen || 'name',
            name: v1.name || tweaks.sampleName,
            style: migratedStyle,
            opts: migratedOpts,
            variant: 0,
          };
        } catch { return null; }
      }, []);

      const [screen, setScreen] = React.useState(initial?.screen || 'name');
      const [name, setName] = React.useState(initial?.name || tweaks.sampleName);
      const [style, setStyle] = React.useState(initial?.style || DEFAULT_STYLE);
      const [opts, setOpts] = React.useState(initial?.opts || defaultOptsFor(DEFAULT_STYLE));
      const [variant, setVariant] = React.useState(initial?.variant || 0);
      const [showExport, setShowExport] = React.useState(false);

      React.useEffect(() => {
        localStorage.setItem('sigtutor:v2', JSON.stringify({ screen, name, style, opts, variant }));

      React.useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accentColor);

      React.useEffect(() => {
        const stage = document.querySelector('.stage');

          warm: `radial-gradient(900px 700px at 10% 5%, rgba(230, 195, 160, 0.55), transparent 60%),

          cool: `radial-gradient(900px 700px at 10% 5%, rgba(160, 195, 230, 0.55), transparent 60%),

                 radial-gradient(1000px 800px at 85% 95%, rgba(180, 200, 220, 0.45), transparent 60%),
                 linear-gradient(180deg, #f1f4f8 0%, #e2e8ef 100%)`,

                Export

              <button className="btn sm" onClick={() => { localStorage.removeItem('sigtutor:v2'); setScreen('name'); setName(tweaks.sampleName); setStyle(DEFAULT_STYLE); setOpts(defaultOptsFor(DEFAULT_STYLE)); setVariant(0); }}>

              </button>
            </div>
          </div>
          <div className="content">{content}</div>

          {showExport && <ExportModal name={name} style={style} opts={opts} variant={variant} onClose={() => setShowExport(false)} />}

          {editMode && (
            <div className="tweaks">
              <h4>Tweaks</h4>
              <div className="t-row">
                <span className="t-label">Sample name</span>
                <input type="text" value={tweaks.sampleName} onChange={e => { patch({ sampleName: e.target.value }); setName(e.target.value); }} />
              </div>
              <div className="t-row">
                <span className="t-label">Accent</span>
                <div style={{ display: 'flex', gap: 5 }}>
                  {['#c6522b', '#2c4f78', '#4a7a4f', '#7a4aa0', '#14110d'].map(c => (
                    <button key={c} onClick={() => patch({ accentColor: c })} style={{ width: 20, height: 20, borderRadius: 10, background: c, border: tweaks.accentColor === c ? '2px solid #14110d' : '0.5px solid rgba(20,17,13,0.15)', cursor: 'pointer', padding: 0 }}></button>
                  ))}
                </div>
              </div>
              <div className="t-row">
                <span className="t-label">Background</span>
                <select value={tweaks.background} onChange={e => patch({ background: e.target.value })}>
                  <option value="warm">Warm</option>
                  <option value="cool">Cool</option>
                  <option value="plain">Plain</option>
                </select>
              </div>
              <div className="t-row">
                <span className="t-label">Jump to</span>
                <select value={screen} onChange={e => setScreen(e.target.value)}>
                  <option value="name">Name</option>
                  <option value="style">Style picker</option>
                  <option value="preview">Preview</option>
                  <option value="hub">Hub</option>
                  <option value="worksheet">Worksheet</option>
                  <option value="practice">Practice canvas</option>
                </select>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
// @inline:app:end
</script>
</body>
</html>
