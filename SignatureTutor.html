<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SignatureTutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
/* SignatureTutor — hi-fi glass design system (Apple-style, light) */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Dancing+Script:wght@400;500;600;700&family=Great+Vibes&family=Allura&family=Sacramento&family=Homemade+Apple&family=Caveat:wght@400;500;600;700&family=Shadows+Into+Light&display=swap');

:root {
  --bg-0: #f4f2ee;
  --bg-1: #ebe8e1;
  --bg-warm: #f7f4ed;
  --ink: #14110d;
  --ink-1: #2d2823;
  --ink-2: #5b544a;
  --ink-3: #8a8378;
  --ink-4: #bab3a6;
  --line: rgba(20, 17, 13, 0.09);
  --line-2: rgba(20, 17, 13, 0.16);
  --accent: #c6522b;
  --accent-2: #e0b778;
  --blue: #2c4f78;
  --green: #4a7a4f;

  /* Glass */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.7);
  --glass-shadow:
    0 1px 0 rgba(255, 255, 255, 0.9) inset,
    0 0 0 0.5px rgba(20, 17, 13, 0.08),
    0 4px 18px rgba(20, 17, 13, 0.06),
    0 24px 60px -20px rgba(20, 17, 13, 0.18);
  --glass-shadow-lg:
    0 1px 0 rgba(255, 255, 255, 0.9) inset,
    0 0 0 0.5px rgba(20, 17, 13, 0.1),
    0 8px 30px rgba(20, 17, 13, 0.08),
    0 40px 100px -30px rgba(20, 17, 13, 0.22);

  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif: 'Fraunces', Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--ink);
  background: var(--bg-0);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Ambient backdrop — soft blurred color blobs behind the glass */
.stage {
  min-height: 100vh;
  position: relative;
  overflow: hidden;
}
.stage::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(900px 700px at 10% 5%, rgba(230, 195, 160, 0.55), transparent 60%),
    radial-gradient(800px 600px at 92% 15%, rgba(198, 82, 43, 0.18), transparent 60%),
    radial-gradient(1000px 800px at 85% 95%, rgba(136, 175, 198, 0.35), transparent 60%),
    radial-gradient(700px 500px at 20% 90%, rgba(224, 183, 120, 0.35), transparent 55%),
    linear-gradient(180deg, #f7f3ec 0%, #ede8de 100%);
  z-index: -2;
}
.stage::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(20,17,13,0.05) 1px, transparent 0);
  background-size: 22px 22px;
  opacity: 0.5;
  z-index: -1;
  pointer-events: none;
}

/* Glass surfaces */
.glass {
  background: var(--glass-bg);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius-md);
}
.glass.strong {
  background: var(--glass-bg-strong);
  box-shadow: var(--glass-shadow-lg);
}
.glass.flat {
  box-shadow:
    0 0 0 0.5px rgba(20, 17, 13, 0.06),
    0 1px 2px rgba(20, 17, 13, 0.04);
}

/* Typography helpers */
.display {
  font-family: var(--serif);
  font-weight: 400;
  letter-spacing: -0.03em;
  line-height: 1.02;
}
.eyebrow {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--ink-3);
  font-weight: 500;
}
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }

/* Buttons */
.btn {
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  padding: 10px 18px;
  border-radius: 999px;
  border: 0.5px solid rgba(20,17,13,0.12);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 1px 3px rgba(20,17,13,0.05);
  white-space: nowrap;
}
.btn:hover { background: rgba(255,255,255,0.85); transform: translateY(-0.5px); }
.btn:active { transform: translateY(0); }
.btn.primary {
  background: var(--ink);
  color: #f6f1e6;
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 8px 24px -6px rgba(20,17,13,0.3);
}
.btn.primary:hover { background: var(--ink-1); }
.btn.accent {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 1px 0 rgba(255,255,255,0.2) inset, 0 8px 24px -6px rgba(198,82,43,0.4);
}
.btn.accent:hover { background: #b24725; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
.btn.ghost:hover { background: rgba(20,17,13,0.04); }
.btn.lg { padding: 14px 24px; font-size: 15px; }
.btn.sm { padding: 6px 12px; font-size: 12px; gap: 4px; }
.btn.icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

/* Icon button pill */
.iconbtn {
  width: 38px; height: 38px;
  border-radius: 999px;
  background: var(--glass-bg-strong);
  backdrop-filter: blur(20px);
  border: 0.5px solid rgba(20,17,13,0.1);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--ink-1);
  transition: all 0.15s ease;
  box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 1px 3px rgba(20,17,13,0.04);
}
.iconbtn:hover { background: #fff; color: var(--ink); }
.iconbtn.active { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Inputs */
.input {
  font-family: var(--sans);
  font-size: 18px;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  border: 0.5px solid rgba(20,17,13,0.14);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(12px);
  color: var(--ink);
  width: 100%;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.input:focus {
  border-color: var(--ink);
  box-shadow: 0 0 0 4px rgba(20,17,13,0.06);
}
.input.big { font-size: 28px; font-family: var(--serif); padding: 20px 22px; font-weight: 400; letter-spacing: -0.01em; }

/* Chip */
.chip {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 11px;
  border-radius: 999px;
  background: rgba(255,255,255,0.7);
  border: 0.5px solid rgba(20,17,13,0.1);
  color: var(--ink-1);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.12s ease;
}
.chip:hover { background: #fff; }
.chip.active { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Progress bar (top) */
.progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--ink-3);
  font-weight: 500;
}
.progress .track { width: 140px; height: 4px; border-radius: 999px; background: rgba(20,17,13,0.08); overflow: hidden; }
.progress .fill { height: 100%; background: var(--ink); border-radius: 999px; transition: width 0.4s cubic-bezier(.2,.7,.3,1); }

/* Card */
.card {
  border-radius: var(--radius-lg);
  background: var(--glass-bg-strong);
  backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  padding: 28px;
}

/* Page layout */
.shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.topbar {
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar .brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.01em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand .mark {
  width: 26px; height: 26px;
  border-radius: 8px;
  background: var(--ink);
  color: #f6f1e6;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--serif);
  font-weight: 500;
  font-size: 16px;
}

.content {
  flex: 1;
  padding: 0 28px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.wrap { width: 100%; max-width: 1180px; }
.wrap-narrow { width: 100%; max-width: 640px; }

/* Sliders */
.slider-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 14px; padding: 8px 0; }
.slider-row .lbl { font-size: 12px; color: var(--ink-2); font-weight: 500; }
.slider-row .val { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; text-align: right; }
.slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 999px;
  background: rgba(20,17,13,0.1); outline: none;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 0.5px solid rgba(20,17,13,0.2);
  box-shadow: 0 1px 3px rgba(20,17,13,0.15), 0 0 0 0.5px rgba(20,17,13,0.06);
  cursor: pointer;
}
.slider::-moz-range-thumb {
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 0.5px solid rgba(20,17,13,0.2);
  box-shadow: 0 1px 3px rgba(20,17,13,0.15);
  cursor: pointer;
}

/* Style card */
.style-card {
  border-radius: var(--radius-md);
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(20px);
  border: 0.5px solid rgba(20,17,13,0.1);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(.2,.7,.3,1);
  position: relative;
  overflow: hidden;
}
.style-card:hover { background: rgba(255,255,255,0.85); transform: translateY(-2px); box-shadow: 0 12px 30px -10px rgba(20,17,13,0.12); }
.style-card.selected {
  background: rgba(255,255,255,0.95);
  border-color: var(--ink);
  box-shadow: 0 0 0 2px var(--ink), 0 20px 40px -15px rgba(20,17,13,0.25);
}
.style-card .label { font-size: 13px; font-weight: 500; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.style-card .preview { height: 80px; display: flex; align-items: center; justify-content: center; }

/* Worksheet row */
.ws-row {
  height: 78px;
  border-bottom: 1px solid rgba(20,17,13,0.08);
  padding: 0 24px 0 56px;
  position: relative;
  display: flex;
  align-items: center;
  background:
    linear-gradient(to bottom, transparent 0%, transparent calc(100% - 22px), rgba(20,17,13,0.04) calc(100% - 22px), rgba(20,17,13,0.04) calc(100% - 21px), transparent calc(100% - 21px));
}
.ws-row .num {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--ink-3);
  font-weight: 500;
  letter-spacing: 0.05em;
  width: 22px;
  text-align: right;
}
.ws-row .stage-badge {
  position: absolute;
  right: 18px;
  top: 10px;
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-weight: 500;
}

/* Tweak panel */
.tweaks {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 200;
  width: 260px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(30px) saturate(180%);
  border: 0.5px solid rgba(255,255,255,0.7);
  border-radius: var(--radius-md);
  box-shadow: var(--glass-shadow-lg);
  padding: 14px 16px;
  font-size: 13px;
}
.tweaks h4 { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.tweaks .t-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 7px 0; }
.tweaks .t-row .t-label { font-size: 12px; color: var(--ink-2); }
.tweaks input[type="text"] { font-family: var(--sans); font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); width: 120px; }
.tweaks select { font-family: var(--sans); font-size: 12px; padding: 3px 6px; border-radius: 6px; border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); }
.tweaks .toggle { border: 0.5px solid rgba(20,17,13,0.15); background: rgba(255,255,255,0.6); padding: 3px 10px; border-radius: 999px; font-size: 11px; cursor: pointer; font-family: var(--sans); }
.tweaks .toggle.on { background: var(--ink); color: #f6f1e6; border-color: transparent; }

/* Modal */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(20,17,13,0.3);
  backdrop-filter: blur(10px);
  z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(40px) saturate(180%);
  border: 0.5px solid var(--glass-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--glass-shadow-lg);
  padding: 28px;
  max-width: 480px;
  width: 100%;
  animation: popIn 0.25s cubic-bezier(.2,.7,.3,1);
}
@keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

/* Fade transitions between screens */
.screen {
  animation: screenIn 0.35s cubic-bezier(.2,.7,.3,1);
}
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Segmented control */
.seg {
  display: inline-flex;
  padding: 3px;
  background: rgba(20,17,13,0.06);
  border-radius: 999px;
  gap: 2px;
}
.seg button {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  font-family: var(--sans);
  background: transparent;
  border: none;
  border-radius: 999px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.15s ease;
}
.seg button.on {
  background: #fff;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20,17,13,0.1);
}

/* Small pulse dot for "live" */
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(74,122,79,0.6); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,122,79,0.5); } 70% { box-shadow: 0 0 0 6px rgba(74,122,79,0); } 100% { box-shadow: 0 0 0 0 rgba(74,122,79,0); } }

/* Signature render families */
.fam-cursive   { font-family: 'Dancing Script', cursive; font-weight: 600; }
.fam-executive { font-family: 'Allura', cursive; font-weight: 400; letter-spacing: 0.01em; }
.fam-loopy     { font-family: 'Great Vibes', cursive; font-weight: 400; }
.fam-scrawl    { font-family: 'Homemade Apple', cursive; font-weight: 400; }
.fam-monogram  { font-family: var(--serif); font-weight: 500; font-style: italic; letter-spacing: 0.02em; }
.fam-sans      { font-family: var(--sans); font-weight: 500; letter-spacing: -0.01em; }
.fam-sacramento { font-family: 'Sacramento', cursive; }

/* Hide scrollbars on inner panes */
.noscroll { scrollbar-width: none; }
.noscroll::-webkit-scrollbar { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      .worksheet-paper, .worksheet-paper * { visibility: visible !important; }
      .worksheet-paper { position: absolute !important; left: 0; top: 0; width: 100% !important; box-shadow: none !important; border: none !important; }
      .tweaks, .topbar { display: none !important; }
    }
  </style>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
// Signature rendering — deterministic procedural signatures from a name.
// Given (name, styleKey), produce an SVG path and stroke data so the same
// signature can be drawn as trace, ghost, or animated stroke-by-stroke.
//
// This isn't a real handwriting model — it's a set of style-specific
// templates that use the letters of the name to vary baseline, slant,
// amplitude. Good enough for a design-layer MVP.

// Lightweight hash → seeded RNG so the same name always gives the same shape.
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function mulberry32(seed) {
  return function() {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Build per-letter stroke segments. Each style returns array of
// {d, len} segments, so we can show stroke numbering.
function buildSignature(name, style, opts = {}) {
  const { width = 720, height = 180, slant = 0.12, flourish = 0.6, weight = 1 } = opts;
  const rng = mulberry32(hash(name + '|' + style));
  const rand = (a, b) => a + rng() * (b - a);

  const letters = name.replace(/\s+/g, ' ').trim().split('');
  if (!letters.length) return { strokes: [], viewBox: `0 0 ${width} ${height}` };

  // Horizontal layout: each char gets a slot proportional to its weight.
  const charWeights = letters.map(c => {
    if (c === ' ') return 0.6;
    if ('ijltI'.includes(c)) return 0.6;
    if ('mwMW'.includes(c)) return 1.4;
    return 1.0;
  });
  const totalWeight = charWeights.reduce((a,b)=>a+b, 0);
  const marginX = 30, marginY = 30;
  const usableW = width - marginX * 2;
  const baseY = height * 0.62;
  const amp = height * 0.32 * (0.6 + flourish * 0.5);

  // Position each char's centerX
  const positions = [];
  let x = marginX;
  for (let i = 0; i < letters.length; i++) {
    const w = (charWeights[i] / totalWeight) * usableW;
    positions.push({ cx: x + w / 2, w, char: letters[i] });
    x += w;
  }

  const segments = [];

  if (style === 'cursive' || style === 'loopy') {
    // Continuous flowing path per word — one stroke per word, plus dots on i/j
    const amplitudeBoost = style === 'loopy' ? 1.4 : 1.0;
    const words = [];
    let curWord = [];
    positions.forEach((p, i) => {
      if (p.char === ' ') { if (curWord.length) words.push(curWord); curWord = []; }
      else curWord.push({ ...p, idx: i });
    });
    if (curWord.length) words.push(curWord);

    words.forEach((word, wi) => {
      const pts = [];
      word.forEach((p, i) => {
        const isUpper = p.char.match(/[A-Z]/);
        const hasDescender = 'gjpqy'.includes(p.char);
        const hasAscender = 'bdfhklt'.includes(p.char);
        const topY = baseY - amp * (isUpper ? 0.95 : hasAscender ? 0.8 : 0.4) * amplitudeBoost;
        const bottomY = baseY + (hasDescender ? amp * 0.4 : 0);

        // lead-in loop
        pts.push({ x: p.cx - p.w * 0.4, y: baseY });
        pts.push({ x: p.cx - p.w * 0.15 + rand(-3, 3), y: topY + rand(-4, 4) });
        // letter body
        if (style === 'loopy' && rng() > 0.4) {
          // extra loop
          pts.push({ x: p.cx - p.w * 0.05, y: baseY + rand(-3, 8) });
          pts.push({ x: p.cx + p.w * 0.05, y: topY + rand(-3, 3) });
        } else {
          pts.push({ x: p.cx, y: (topY + baseY) / 2 + rand(-4, 4) });
        }
        pts.push({ x: p.cx + p.w * 0.15, y: baseY + rand(-2, 4) });
        if (hasDescender) pts.push({ x: p.cx + p.w * 0.2, y: bottomY });
        pts.push({ x: p.cx + p.w * 0.35, y: baseY - 3 + rand(-2, 2) });
      });
      // Apply slant
      const slanted = pts.map(pt => ({ x: pt.x + (baseY - pt.y) * slant, y: pt.y }));
      const d = smoothPath(slanted);
      segments.push({ d, kind: 'body', wordIndex: wi, length: approxLen(slanted) });

      // Dots for i, j
      word.forEach(p => {
        if (p.char === 'i' || p.char === 'j') {
          const dx = (baseY - (baseY - amp * 0.55)) * slant;
          segments.push({
            d: `M ${p.cx + dx - 1} ${baseY - amp * 0.55} l 2 0`,
            kind: 'dot', length: 3,
          });
        }
      });

      // Flourish tail on last word
      if (wi === words.length - 1 && flourish > 0.3) {
        const last = word[word.length - 1];
        const startX = last.cx + last.w * 0.35;
        const startY = baseY - 3;
        const tail = `M ${startX} ${startY} q ${30 + flourish*40} ${-flourish*25} ${50 + flourish*60} ${flourish*5} t ${40} ${-flourish*8}`;
        segments.push({ d: tail, kind: 'flourish', length: 60 + flourish * 60 });
      }
    });
  } else if (style === 'executive') {
    // Sharp, angular — one stroke per letter, straighter lines
    positions.forEach((p, i) => {
      if (p.char === ' ') return;
      const isUpper = p.char.match(/[A-Z]/);
      const topY = baseY - amp * (isUpper ? 0.95 : 0.6);
      const pts = [];
      pts.push({ x: p.cx - p.w * 0.35, y: baseY + 2 });
      pts.push({ x: p.cx - p.w * 0.1, y: topY });
      pts.push({ x: p.cx + p.w * 0.1, y: baseY });
      pts.push({ x: p.cx + p.w * 0.3, y: topY + amp * 0.3 });
      pts.push({ x: p.cx + p.w * 0.4, y: baseY });
      const slanted = pts.map(pt => ({ x: pt.x + (baseY - pt.y) * (slant + 0.08), y: pt.y }));
      const d = slanted.reduce((acc, pt, j) => acc + (j === 0 ? 'M ' : ' L ') + pt.x.toFixed(1) + ' ' + pt.y.toFixed(1), '');
      segments.push({ d, kind: 'body', length: approxLen(slanted) });
    });
    // Underline flourish
    if (flourish > 0.2) {
      const startX = positions[positions.length-1].cx;
      const endX = positions[0].cx;
      segments.push({
        d: `M ${startX + 20} ${baseY + 20} Q ${(startX + endX)/2} ${baseY + 30 + flourish*10} ${endX - 20} ${baseY + 18}`,
        kind: 'flourish', length: Math.abs(startX - endX),
      });
    }
  } else if (style === 'scrawl') {
    // Quick, messy — single chaotic path
    const pts = [];
    pts.push({ x: marginX, y: baseY });
    positions.forEach(p => {
      if (p.char === ' ') { pts.push({ x: p.cx, y: baseY + rand(-4, 4) }); return; }
      pts.push({ x: p.cx - p.w * 0.3, y: baseY + rand(-8, 8) });
      pts.push({ x: p.cx, y: baseY - amp * rand(0.3, 0.8) });
      pts.push({ x: p.cx + p.w * 0.15, y: baseY + rand(-6, 10) });
    });
    pts.push({ x: width - marginX, y: baseY - 4 });
    const slanted = pts.map(pt => ({ x: pt.x + (baseY - pt.y) * slant * 0.5, y: pt.y }));
    segments.push({ d: smoothPath(slanted), kind: 'body', length: approxLen(slanted) });
  } else if (style === 'sans') {
    // Printed-feel — one segment per letter stroke, plain
    positions.forEach(p => {
      if (p.char === ' ') return;
      const topY = baseY - amp * 0.7;
      segments.push({ d: `M ${p.cx - p.w*0.3} ${baseY} L ${p.cx - p.w*0.3} ${topY} L ${p.cx + p.w*0.3} ${topY} L ${p.cx + p.w*0.3} ${baseY}`, kind: 'body', length: amp*2 + p.w });
    });
  } else if (style === 'monogram') {
    // Two big letters (initials)
    const initials = name.split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('');
    const cx = width / 2, cy = height / 2;
    const R = Math.min(width, height) * 0.28;
    segments.push({ d: `M ${cx - R} ${cy} A ${R} ${R} 0 1 1 ${cx + R} ${cy} A ${R} ${R} 0 1 1 ${cx - R} ${cy}`, kind: 'frame', length: 2 * Math.PI * R });
    // Letters rendered as text — returned separately
    return { strokes: segments, viewBox: `0 0 ${width} ${height}`, monogram: initials, width, height };
  }

  return { strokes: segments, viewBox: `0 0 ${width} ${height}`, width, height };
}

// Catmull-Rom through points → smooth cubic bezier path
function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || p2;
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
}

function approxLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) {
    const dx = pts[i].x - pts[i-1].x, dy = pts[i].y - pts[i-1].y;
    L += Math.hypot(dx, dy);
  }
  return L;
}

// React component — render a signature at given opacity/state.
function SignatureSVG({ name, style, opts = {}, opacity = 1, strokeColor = 'var(--ink)', strokeW = 2.4, width = 720, height = 180, showArrows = false, animate = false, className = '', extraTop = null, extraBottom = null }) {
  const sig = React.useMemo(() => buildSignature(name || 'Your Name', style, { ...opts, width, height }), [name, style, opts.slant, opts.flourish, opts.weight, width, height]);
  const [drawProgress, setDrawProgress] = React.useState(animate ? 0 : 1);
  React.useEffect(() => {
    if (!animate) { setDrawProgress(1); return; }
    let raf, start;
    const step = (t) => {
      if (!start) start = t;
      const p = Math.min(1, (t - start) / 1800);
      setDrawProgress(p);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [animate, name, style]);

  return (
    <svg viewBox={sig.viewBox} className={className} style={{ width: '100%', height: '100%', display: 'block', opacity }} preserveAspectRatio="xMidYMid meet">
      {extraTop}
      {sig.monogram && (
        <text x={sig.width/2} y={sig.height/2 + 24} textAnchor="middle" fontFamily="Fraunces, serif" fontSize="72" fontStyle="italic" fontWeight="500" fill={strokeColor}>
          {sig.monogram}
        </text>
      )}
      {sig.strokes.map((s, i) => {
        const len = s.length || 300;
        const dashArray = animate ? len : undefined;
        const dashOffset = animate ? len * (1 - drawProgress) : 0;
        return (
          <g key={i}>
            <path
              d={s.d}
              fill="none"
              stroke={strokeColor}
              strokeWidth={strokeW * (opts.weight || 1)}
              strokeLinecap="round"
              strokeLinejoin="round"
              strokeDasharray={dashArray}
              strokeDashoffset={dashOffset}
            />
            {showArrows && s.kind === 'body' && i < 3 && (
              <StrokeArrow d={s.d} index={i + 1} />
            )}
          </g>
        );
      })}
      {extraBottom}
    </svg>
  );
}

function StrokeArrow({ d, index }) {
  // Place a numbered circle at the start of each stroke
  const m = d.match(/M\s*([-\d.]+)\s+([-\d.]+)/);
  if (!m) return null;
  const x = parseFloat(m[1]);
  const y = parseFloat(m[2]);
  return (
    <g>
      <circle cx={x - 8} cy={y - 12} r="9" fill="#c6522b" />
      <text x={x - 8} y={y - 9} textAnchor="middle" fontSize="11" fontWeight="700" fontFamily="Inter, sans-serif" fill="#fff">{index}</text>
    </g>
  );
}

Object.assign(window, { buildSignature, SignatureSVG });
  </script>

            <div className="display" style={{ fontSize: 22, marginTop: 6 }}>{name}</div>

// ─────────────── Practice canvas ───────────────
function PracticeScreen({ name, style, opts, onBack }) {
  const [row, setRow] = React.useState(0);
  const [penColor, setPenColor] = React.useState('#14110d');
  const [score, setScore] = React.useState(null);
  const [strokes, setStrokes] = React.useState([]);
  const [showGhost, setShowGhost] = React.useState(true);
  const canvasRef = React.useRef(null);
  const overlayRef = React.useRef(null);
  const drawingRef = React.useRef(null);

  const stages = [
    { stage: 'guide',  label: 'Full guide',    arrows: true,  opacity: 1 },
    { stage: 'guide',  label: 'Full guide',    arrows: false, opacity: 1 },
    { stage: 'fade50', label: '50% fade',      arrows: false, opacity: 0.35 },
    { stage: 'fade50', label: '50% fade',      arrows: false, opacity: 0.35 },
    { stage: 'fade20', label: '20% fade',      arrows: false, opacity: 0.14 },
    { stage: 'fade20', label: '20% fade',      arrows: false, opacity: 0.14 },
    { stage: 'blank',  label: 'Freehand',      arrows: false, opacity: 0 },
    { stage: 'blank',  label: 'Freehand · last', arrows: false, opacity: 0 },
  ];
  const cur = stages[row];
  const progress = ((row + 1) / stages.length) * 100;

  // Canvas drawing
  const onPointerDown = (e) => {
    const c = canvasRef.current; if (!c) return;
    c.setPointerCapture(e.pointerId);
    const rect = c.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (c.width / rect.width);
    const y = (e.clientY - rect.top)  * (c.height / rect.height);
    const pressure = e.pressure || 0.5;
    drawingRef.current = { points: [{ x, y, p: pressure, t: performance.now() }] };
    const ctx = c.getContext('2d');
    ctx.strokeStyle = penColor;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  };
  const onPointerMove = (e) => {
    if (!drawingRef.current) return;
    const c = canvasRef.current;
    const rect = c.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (c.width / rect.width);
    const y = (e.clientY - rect.top)  * (c.height / rect.height);
    const pressure = e.pressure || 0.5;
    const pts = drawingRef.current.points;
    const last = pts[pts.length - 1];
    pts.push({ x, y, p: pressure, t: performance.now() });
    const ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.lineWidth = 1.5 + pressure * 3.2;
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(x, y);
    ctx.stroke();
  };
  const onPointerUp = () => {
    if (!drawingRef.current) return;
    setStrokes(s => [...s, drawingRef.current]);
    drawingRef.current = null;
  };

  const clearCanvas = () => {
    const c = canvasRef.current;
    if (!c) return;
    c.getContext('2d').clearRect(0, 0, c.width, c.height);
    setStrokes([]);
    setScore(null);
  };

  const checkAccuracy = () => {
    // Fake-but-plausible score: weight by # strokes + a seeded noise
    const n = strokes.length + 1;
    const s = Math.min(98, 60 + n * 4 + Math.floor(Math.random() * 20));
    setScore(s);
  };

  const nextRow = () => {
    clearCanvas();
    setRow(r => Math.min(stages.length - 1, r + 1));
  };
  const prevRow = () => {
    clearCanvas();
    setRow(r => Math.max(0, r - 1));
  };

  // Resize canvas to its container
  React.useEffect(() => {
    const c = canvasRef.current; if (!c) return;
    const resize = () => {
      const rect = c.getBoundingClientRect();
      c.width = rect.width * 2;
      c.height = rect.height * 2;
      const ctx = c.getContext('2d');
      ctx.scale(2, 2);
    };
    resize();
    const ro = new ResizeObserver(resize);
    ro.observe(c);
    return () => ro.disconnect();
  }, []);

  return (
    <div className="screen wrap" style={{ paddingTop: 20, paddingBottom: 20 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <button className="btn ghost sm" onClick={onBack}>
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M11 7H3M7 3L3 7l4 4"/></svg>
            Exit
          </button>
          <div>
            <div className="eyebrow" style={{ marginBottom: 4 }}>Practice · row {row + 1} of {stages.length}</div>
            <div className="display" style={{ fontSize: 22 }}>{name}</div>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <span className="faint" style={{ fontSize: 12, display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <span className="live-dot"></span> Live · pressure on
          </span>
          <div style={{ width: 160, height: 4, background: 'rgba(20,17,13,0.08)', borderRadius: 999, overflow: 'hidden' }}>
            <div style={{ width: `${progress}%`, height: '100%', background: 'var(--ink)', transition: 'width 0.3s' }}></div>
          </div>
        </div>
      </div>

      {/* Coach card */}
      <div className="card" style={{ padding: '14px 20px', marginBottom: 14, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 32, height: 32, borderRadius: 10, background: 'var(--accent)', color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14 }}>★</div>
          <div>
            <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--ink-3)' }}>Coach · {cur.label}</div>
            <div style={{ fontSize: 14, marginTop: 2 }}>
              {row === 0 && 'Follow the numbered strokes. Keep your pen down through each word.'}
              {row === 1 && 'Trace the full guide. Try to match the slant and spacing.'}
              {(row === 2 || row === 3) && 'Guide is lighter now — use it as a hint, not a cage.'}
              {(row === 4 || row === 5) && 'Almost gone. Trust your muscle memory.'}
              {row >= 6 && 'Freehand. Do it three times without looking back.'}
            </div>
          </div>
        </div>
        {score !== null && (
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 11, color: 'var(--ink-3)', textTransform: 'uppercase', letterSpacing: '0.1em' }}>Accuracy</div>
            <div className="display" style={{ fontSize: 28, color: score > 80 ? 'var(--green)' : score > 60 ? 'var(--accent)' : 'var(--ink-2)' }}>{score}%</div>
          </div>
        )}
      </div>

      {/* Canvas */}
      <div className="card" style={{ padding: 0, overflow: 'hidden', position: 'relative', minHeight: 340 }}>
        {/* Ghost layer */}
        {showGhost && cur.opacity > 0 && (
          <div style={{ position: 'absolute', inset: 30, pointerEvents: 'none' }}>
            <SignatureSVG name={name} style={style} opts={opts} strokeColor="#14110d" strokeW={2.6} opacity={cur.opacity} showArrows={cur.arrows} height={280} />
          </div>
        )}
        {/* Drawing canvas */}
        <canvas
          ref={canvasRef}
          style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', touchAction: 'none', cursor: 'crosshair' }}
          onPointerDown={onPointerDown}
          onPointerMove={onPointerMove}
          onPointerUp={onPointerUp}
          onPointerCancel={onPointerUp}
        />
        {/* Baseline */}
        <div style={{ position: 'absolute', left: 30, right: 30, top: '62%', height: 1, background: 'rgba(20,17,13,0.08)', pointerEvents: 'none' }}></div>
      </div>

      {/* Dock */}
      <div className="card" style={{ padding: '12px 18px', marginTop: 14, display: 'flex', alignItems: 'center', gap: 12 }}>
        <div style={{ display: 'flex', gap: 6 }}>
          {['#14110d', '#2c4f78', '#c6522b', '#4a7a4f'].map(c => (
            <button key={c} className="iconbtn" style={{ background: c, border: penColor === c ? '2px solid var(--ink)' : '0.5px solid rgba(20,17,13,0.1)' }} onClick={() => setPenColor(c)}></button>
          ))}
        </div>
        <div style={{ width: 1, height: 24, background: 'rgba(20,17,13,0.1)' }}></div>
        <button className="iconbtn" title="Undo" onClick={() => { clearCanvas(); }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M3 8a5 5 0 1 1 5 5H6M3 5v3h3"/></svg>
        </button>
        <button className={`iconbtn ${showGhost ? 'active' : ''}`} title="Toggle ghost" onClick={() => setShowGhost(g => !g)}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M2 8a6 6 0 0 1 12 0v6l-2-1.5L10 14l-2-1.5L6 14l-2-1.5L2 14z"/></svg>
        </button>
        <div style={{ flex: 1 }}></div>
        <button className="btn sm" onClick={prevRow} disabled={row === 0}>◀ Prev</button>
        <button className="btn sm" onClick={checkAccuracy}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M2 7l3 3 7-7"/></svg>
          Check
        </button>
        <button className="btn primary sm" onClick={nextRow} disabled={row === stages.length - 1}>Next row ▶</button>
      </div>
    </div>
  );
}

// ─────────────── Export modal ───────────────
function ExportModal({ name, style, opts, onClose }) {
  const [copied, setCopied] = React.useState(false);
  const copyLink = () => {
    const params = new URLSearchParams({ name, style, f: opts.flourish, s: opts.slant, w: opts.weight });
    navigator.clipboard?.writeText(`https://signature-tutor.app/s/${btoa(params.toString()).slice(0, 10)}`);
    setCopied(true);
    setTimeout(() => setCopied(false), 1600);
  };
  return (
    <div className="backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
          <div>
            <div className="eyebrow" style={{ marginBottom: 6 }}>Export</div>
            <h2 className="display" style={{ fontSize: 28, margin: 0 }}>Take it with you</h2>
          </div>
          <button className="iconbtn" onClick={onClose}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><path d="M3 3l8 8M11 3l-8 8"/></svg>
          </button>
        </div>

        <div style={{ padding: '20px 24px', background: '#fefdfa', border: '0.5px solid rgba(20,17,13,0.08)', borderRadius: 12, marginBottom: 18, height: 110 }}>
          <SignatureSVG name={name} style={style} opts={opts} height={80} strokeW={2.4} />
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
          {[
            { k: 'svg', t: 'SVG', d: 'Vector, infinite resolution' },
            { k: 'png', t: 'PNG', d: 'Transparent raster' },
            { k: 'pdf', t: 'Worksheet PDF', d: '8-row practice sheet' },
            { k: 'gif', t: 'Stroke-order GIF', d: 'Animated reveal' },
          ].map(o => (
            <button key={o.k} className="glass" style={{ padding: 14, textAlign: 'left', border: '0.5px solid rgba(20,17,13,0.1)', background: 'rgba(255,255,255,0.6)', cursor: 'pointer', borderRadius: 12, fontFamily: 'inherit' }}>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 2 }}>{o.t}</div>
              <div style={{ fontSize: 11, color: 'var(--ink-3)' }}>{o.d}</div>
            </button>
          ))}
        </div>

        <div style={{ marginTop: 16, padding: 14, background: 'rgba(20,17,13,0.04)', borderRadius: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 10l-2 2a3 3 0 1 1-4-4l2-2M9 6l2-2a3 3 0 1 1 4 4l-2 2M6 10l4-4"/></svg>
          <div style={{ flex: 1, fontSize: 12, fontFamily: 'ui-monospace, Menlo, monospace', color: 'var(--ink-2)' }}>
            signature-tutor.app/s/{btoa(name).slice(0, 10)}
          </div>
          <button className="btn sm" onClick={copyLink}>{copied ? '✓ Copied' : 'Copy link'}</button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { HubScreen, WorksheetScreen, PracticeScreen, ExportModal });
  </script>

  <script type="text/babel" data-presets="react">
    const TWEAK_DEFAULTS = {
      "sampleName": "Alex Morgan",
      "accentColor": "#c6522b",
      "background": "warm",
      "startScreen": "name"
    };

    function App() {
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
      const [editMode, setEditMode] = React.useState(false);

      const initial = React.useMemo(() => {
        try {
          const saved = JSON.parse(localStorage.getItem('sigtutor:v1') || '{}');
          return {
            screen: saved.screen || tweaks.startScreen || 'name',
            name: saved.name || tweaks.sampleName,
            style: saved.style || 'cursive',
            opts: saved.opts || { flourish: 0.7, slant: 0.14, weight: 1.0 },
          };
        } catch { return null; }
      }, []);

      const [screen, setScreen] = React.useState(initial?.screen || 'name');
      const [name, setName] = React.useState(initial?.name || tweaks.sampleName);
      const [style, setStyle] = React.useState(initial?.style || 'cursive');
      const [opts, setOpts] = React.useState(initial?.opts || { flourish: 0.7, slant: 0.14, weight: 1.0 });
      const [showExport, setShowExport] = React.useState(false);

      React.useEffect(() => {
        localStorage.setItem('sigtutor:v1', JSON.stringify({ screen, name, style, opts }));
      }, [screen, name, style, opts]);

      React.useEffect(() => {
        document.documentElement.style.setProperty('--accent', tweaks.accentColor);
      }, [tweaks.accentColor]);

      React.useEffect(() => {
        const stage = document.querySelector('.stage');
        if (!stage) return;
        stage.dataset.bg = tweaks.background;
        const css = {
          warm: `radial-gradient(900px 700px at 10% 5%, rgba(230, 195, 160, 0.55), transparent 60%),
                 radial-gradient(800px 600px at 92% 15%, rgba(198, 82, 43, 0.18), transparent 60%),
                 radial-gradient(1000px 800px at 85% 95%, rgba(136, 175, 198, 0.35), transparent 60%),
                 radial-gradient(700px 500px at 20% 90%, rgba(224, 183, 120, 0.35), transparent 55%),
                 linear-gradient(180deg, #f7f3ec 0%, #ede8de 100%)`,
          cool: `radial-gradient(900px 700px at 10% 5%, rgba(160, 195, 230, 0.55), transparent 60%),
                 radial-gradient(800px 600px at 92% 15%, rgba(120, 150, 220, 0.22), transparent 60%),
                 radial-gradient(1000px 800px at 85% 95%, rgba(180, 200, 220, 0.45), transparent 60%),
                 linear-gradient(180deg, #f1f4f8 0%, #e2e8ef 100%)`,
          plain: `linear-gradient(180deg, #f4f2ee 0%, #ebe8e1 100%)`,
        }[tweaks.background] || '';
        let s = document.getElementById('bg-override');
        if (!s) { s = document.createElement('style'); s.id = 'bg-override'; document.head.appendChild(s); }
        s.textContent = `.stage::before { background: ${css} !important; }`;
      }, [tweaks.background]);

      React.useEffect(() => {
        const onMsg = (e) => {
          if (e.data?.type === '__activate_edit_mode') setEditMode(true);
          if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
        };
        window.addEventListener('message', onMsg);
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', onMsg);
      }, []);

      const patch = (p) => {
        const next = { ...tweaks, ...p };
        setTweaks(next);
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: p }, '*');
      };

      const go = (s) => {
        if (s === 'export') setShowExport(true);
        else setScreen(s);
      };

      let content = null;
      if (screen === 'name') content = <NameScreen name={name} setName={setName} onNext={() => setScreen('style')} />;
      else if (screen === 'style') content = <StyleScreen name={name} selected={style} setSelected={setStyle} onNext={() => setScreen('preview')} onBack={() => setScreen('name')} />;
      else if (screen === 'preview') content = <PreviewScreen name={name} style={style} opts={opts} setOpts={setOpts} onHub={() => setScreen('hub')} onBack={() => setScreen('style')} />;
      else if (screen === 'hub') content = <HubScreen name={name} style={style} opts={opts} go={go} onBack={() => setScreen('preview')} />;
      else if (screen === 'worksheet') content = <WorksheetScreen name={name} style={style} opts={opts} onBack={() => setScreen('hub')} onExport={() => setShowExport(true)} />;
      else if (screen === 'practice') content = <PracticeScreen name={name} style={style} opts={opts} onBack={() => setScreen('hub')} />;

      const crumbs = [
        { k: 'name', l: 'Name' },
        { k: 'style', l: 'Style' },
        { k: 'preview', l: 'Preview' },
        { k: 'hub', l: 'Hub' },
      ];
      const showCrumbs = !['practice', 'worksheet'].includes(screen);

      return (
        <div className="shell" data-screen-label={screen}>
          <div className="topbar">
            <Logo />
            {showCrumbs && (
              <div className="seg">
                {crumbs.map(c => (
                  <button key={c.k} className={screen === c.k ? 'on' : ''} onClick={() => setScreen(c.k)}>{c.l}</button>
                ))}
              </div>
            )}
            <div style={{ display: 'flex', gap: 10 }}>
              <button className="btn sm" onClick={() => setShowExport(true)}>
                <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M8 2v9M4 7l4 4 4-4M3 14h10"/></svg>
                Export
              </button>
              <button className="btn sm" onClick={() => { localStorage.removeItem('sigtutor:v1'); setScreen('name'); setName(tweaks.sampleName); setStyle('cursive'); setOpts({ flourish: 0.7, slant: 0.14, weight: 1.0 }); }}>
                Restart
              </button>
            </div>
          </div>
          <div className="content">{content}</div>

          {showExport && <ExportModal name={name} style={style} opts={opts} onClose={() => setShowExport(false)} />}

          {editMode && (
            <div className="tweaks">
              <h4>Tweaks</h4>
              <div className="t-row">
                <span className="t-label">Sample name</span>
                <input type="text" value={tweaks.sampleName} onChange={e => { patch({ sampleName: e.target.value }); setName(e.target.value); }} />
              </div>
              <div className="t-row">
                <span className="t-label">Accent</span>
                <div style={{ display: 'flex', gap: 5 }}>
                  {['#c6522b', '#2c4f78', '#4a7a4f', '#7a4aa0', '#14110d'].map(c => (
                    <button key={c} onClick={() => patch({ accentColor: c })} style={{ width: 20, height: 20, borderRadius: 10, background: c, border: tweaks.accentColor === c ? '2px solid #14110d' : '0.5px solid rgba(20,17,13,0.15)', cursor: 'pointer', padding: 0 }}></button>
                  ))}
                </div>
              </div>
              <div className="t-row">
                <span className="t-label">Background</span>
                <select value={tweaks.background} onChange={e => patch({ background: e.target.value })}>
                  <option value="warm">Warm</option>
                  <option value="cool">Cool</option>
                  <option value="plain">Plain</option>
                </select>
              </div>
              <div className="t-row">
                <span className="t-label">Jump to</span>
                <select value={screen} onChange={e => setScreen(e.target.value)}>
                  <option value="name">Name</option>
